# Include from nginx's http context. Replace hostname, certificates and static root.
limit_req_zone $binary_remote_addr zone=inbox_login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=inbox_ask:10m rate=12r/m;
server {
    listen 80;
    server_name inbox.example.com;
    access_log off;
    error_log /dev/null crit;
    return 308 https://inbox.example.com$request_uri;
}
server {
    listen 443 ssl;
    server_name inbox.example.com;
    ssl_certificate /etc/letsencrypt/live/inbox.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/inbox.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /srv/smart-inbox/frontend/dist;
    index index.html;
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 32k;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; base-uri 'none'; object-src 'none'; frame-ancestors 'none'; form-action 'self'" always;
    # Rate-limit the actual sign-in/consent starts, including the legacy GET.
    # A regex location must use proxy_pass without a URI suffix.
    location ~ ^/api/auth/(session|google(/start|/login/start)?)$ {
        limit_req zone=inbox_login burst=10 nodelay;
        limit_req_status 429;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
    location = /api/ask {
        limit_req zone=inbox_ask burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000/ask;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 300s;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location = /index.html { expires -1; }
    location / { try_files $uri $uri/ /index.html; expires -1; }
    location ~ /\. { deny all; }
}
