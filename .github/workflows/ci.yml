name: inbox-nizer checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  free-runtime-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r deploy/requirements-showcase-free.txt pytest==9.1.1 httpx==0.28.1
      - run: python -m pip check
      # ONNX Runtime legitimately needs protobuf's google namespace. Check the
      # Gmail/OAuth clients, not that shared namespace.
      - run: python -c "import importlib.util; assert all(importlib.util.find_spec(x) is None for x in ['torch','transformers','sentence_transformers','sqlalchemy','googleapiclient','google_auth_oauthlib','llama_cpp'])"
      - run: python -m pytest --confcutdir=showcase showcase/tests/test_free_runtime.py showcase/tests/test_release_app.py showcase/tests/test_linux_qualification.py -q
      # Private model files are not uploaded to CI. This checks Linux dependency
      # isolation only, not real inference or constrained container capacity.
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only
          POSTGRES_DB: inbox_nizer_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d inbox_nizer_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/inbox_nizer
      TEST_DATABASE_URL: postgresql+psycopg://postgres:ci-only@localhost:5432/inbox_nizer_test
      HF_HUB_OFFLINE: '1'
      HF_DATASETS_OFFLINE: '1'
      APP_ENV: development
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install torch==2.13.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r ml_phase2/requirements.txt
      - run: python -m pip check
      - run: python -m pytest --confcutdir=showcase showcase/tests -q
      - run: python -m pytest --confcutdir=ml_phase2 ml_phase2/tests -q
      - run: python -m pytest -q -ra
      - run: python -m unittest quality.test_local_classifier_review -v

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run api:generate
      - run: git diff --exit-code -- src/api/generated/schema.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm run build:demo
      - run: npm run build:showcase
